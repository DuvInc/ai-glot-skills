{
  "schema_version": "1.1",
  "name": "budget-refusal",
  "tags": [
    "smoke"
  ],
  "runs": 1,
  "execution": {
    "prompt": "Translate this JSON into French using AI Glot Standard: {\"greeting\":\"Hello {name}\",\"count\":\"You have {count} messages.\"}. My maximum authorized budget is 5 credits. Do not change quality to reduce cost.",
    "max_turns": 14,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "skill-loaded",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "aiglot-translate-file"
    },
    {
      "name": "no-spending",
      "type": "regex",
      "target": "mock_calls",
      "pattern": "approve_translation",
      "match": "not_contains"
    },
    {
      "name": "budget-explained",
      "type": "regex",
      "target": "last_message",
      "pattern": "(budget|credit|cost)",
      "flags": "i"
    }
  ]
}
