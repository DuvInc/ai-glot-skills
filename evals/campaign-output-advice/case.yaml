{
  "schema_version": "1.1",
  "name": "campaign-output-advice",
  "tags": [
    "expanded"
  ],
  "runs": 1,
  "execution": {
    "prompt": "With AI Glot, how should I translate one DOCX into French, German and Spanish as three separate documents? Compare CLI, MCP and REST and explain parallel execution, budgeting and recovery. Explain only; do not create or approve jobs.",
    "max_turns": 16,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "skill-loaded",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "aiglot-run-translations"
    },
    {
      "name": "workflow",
      "type": "llm",
      "focus": "last_message",
      "criteria": "PASS if it recommends independent batches from the same source, CLI for local files/scripts, connected MCP for assistants and REST for integrations, reviews combined measured cost, uses bounded parallelism and preserves IDs for recovery. FAIL if it claims one DOCX batch universally returns three files, chains translations or invents --languages/--parallel CLI flags."
    },
    {
      "name": "no-writes",
      "type": "regex",
      "target": "mock_calls",
      "pattern": "(create_translation|approve_translation|edit_glossary_terms|delete_glossary|update_batch|cancel_translation)",
      "match": "not_contains"
    }
  ]
}
