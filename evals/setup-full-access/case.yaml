{
  "schema_version": "1.1",
  "name": "setup-full-access",
  "tags": [
    "onboarding-scopes"
  ],
  "runs": 1,
  "execution": {
    "prompt": "Use the AI Glot workspace skill to recommend the OAuth setup for my local CLI. I want to connect once and later translate files, check usage, manage history and edit glossaries. Give the recommended login command, but do not run login or modify anything.",
    "max_turns": 12,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "skill-loaded",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "aiglot-manage-workspace"
    },
    {
      "name": "scope-recommendation",
      "type": "llm",
      "focus": "last_message",
      "criteria": "PASS if the answer recommends Full access and includes account:read, usage:read, batches:read, batches:write, batches:create, glossaries:read, glossaries:write and webhooks:write in the CLI login scope list, explains that webhooks are not active yet and requires user OAuth consent. FAIL if it recommends only account:read or task-specific partial grants, silently authenticates, or starts a translation."
    },
    {
      "name": "no-setup-writes",
      "type": "regex",
      "target": "mock_calls",
      "pattern": "(create_translation|plan_translation|approve_translation|edit_glossary_terms|delete_glossary|update_batch|cancel_translation)",
      "match": "not_contains"
    }
  ]
}
