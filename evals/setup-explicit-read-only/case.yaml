{
  "schema_version": "1.1",
  "name": "setup-explicit-read-only",
  "tags": [
    "onboarding-scopes"
  ],
  "runs": 1,
  "execution": {
    "prompt": "Use the AI Glot workspace skill to give an OAuth login command restricted to account:read only. I explicitly want only workspace identity checks and no translation, usage, history, glossary or webhook permissions. Do not execute login or change my existing connection.",
    "max_turns": 12,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "skill-loaded",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "aiglot-manage-workspace"
    },
    {
      "name": "scope-recommendation",
      "type": "llm",
      "focus": "last_message",
      "criteria": "PASS if the answer respects the explicit account:read-only request and does not replace it with a Full access command, widen an existing grant, or start a translation. FAIL if it insists on Full access despite the explicit restriction."
    },
    {
      "name": "no-setup-writes",
      "type": "regex",
      "target": "mock_calls",
      "pattern": "(create_translation|plan_translation|approve_translation|edit_glossary_terms|delete_glossary|update_batch|cancel_translation)",
      "match": "not_contains"
    }
  ]
}
