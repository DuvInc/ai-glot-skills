{
  "schema_version": "1.1",
  "tags": [
    "smoke"
  ],
  "runs": 1,
  "execution": {
    "max_turns": 14,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "prompt": "Use AI Glot to translate this JSON into French: {\"greeting\":\"Hello {name}\",\"count\":\"You have {count} messages.\"}. Use Standard and preserve the placeholders. I authorize up to 10 credits."
  },
  "name": "connection-failure",
  "graders": [
    {
      "name": "no-unauthenticated-work",
      "type": "regex",
      "target": "mock_calls",
      "pattern": "(create_translation|approve_translation)",
      "match": "not_contains"
    },
    {
      "name": "reconnect-explained",
      "type": "regex",
      "target": "last_message",
      "pattern": "(connect|auth|sign.?in)",
      "flags": "i"
    }
  ]
}
