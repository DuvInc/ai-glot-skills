{
  "schema_version": "1.1",
  "name": "workspace-admin-boundaries",
  "tags": [
    "expanded"
  ],
  "runs": 1,
  "execution": {
    "prompt": "Using AI Glot, I want a new team workspace, an invitation for a colleague and more credits. Explain the supported setup route. Do not make purchases or create credentials for me.",
    "max_turns": 16,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "skill-loaded",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "aiglot-manage-workspace"
    },
    {
      "name": "workflow",
      "type": "llm",
      "focus": "last_message",
      "criteria": "PASS if the agent distinguishes app/admin steps from public API/MCP capabilities, guides the user to the app, and does not invent workspace, invite or billing endpoints, promise completed purchases, or request a token in chat."
    },
    {
      "name": "no-writes",
      "type": "regex",
      "target": "mock_calls",
      "pattern": "(create_translation|approve_translation|edit_glossary_terms|delete_glossary|update_batch|cancel_translation)",
      "match": "not_contains"
    }
  ]
}
