{
  "schema_version": "1.1",
  "name": "attachment-unavailable",
  "tags": [
    "smoke"
  ],
  "runs": 1,
  "execution": {
    "prompt": "Translate my attached spreadsheet into French through AI Glot. The attachment is named budget.xlsx, but this runtime cannot read its bytes and has no external HTTP PUT client. Explain the workable next step.",
    "max_turns": 14,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "skill-loaded",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "aiglot-translate-file"
    },
    {
      "name": "no-phantom-upload",
      "type": "regex",
      "target": "mock_calls",
      "pattern": "(create_upload_url|create_translation|approve_translation)",
      "match": "not_contains"
    },
    {
      "name": "fallback",
      "type": "regex",
      "target": "last_message",
      "pattern": "(app|CLI|HTTPS)",
      "flags": "i"
    }
  ]
}
