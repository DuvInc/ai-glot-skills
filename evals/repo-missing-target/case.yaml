{
  "schema_version": "1.1",
  "name": "repo-missing-target",
  "tags": [
    "smoke"
  ],
  "runs": 1,
  "execution": {
    "prompt": "Localize the JSON resources in my repository with AI Glot. The source is messages/en.json. I have not chosen target locales or output paths yet; ask only what is needed before creating any work.",
    "max_turns": 14,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "no-premature-create",
      "type": "regex",
      "target": "mock_calls",
      "pattern": "(create_translation|approve_translation)",
      "match": "not_contains"
    },
    {
      "name": "scope-question",
      "type": "regex",
      "target": "last_message",
      "pattern": "(locale|language|destination|path)",
      "flags": "i"
    }
  ]
}
