{
  "schema_version": "1.1",
  "name": "paid-guidelines-context",
  "tags": [
    "expanded"
  ],
  "runs": 1,
  "execution": {
    "prompt": "Use AI Glot to translate this JSON from English into French: {\"greeting\":\"Hello {name}\",\"count\":\"You have {count} messages.\"}. This is a B2B inventory product for professional buyers. Use formal vous and preserve placeholders. I authorize Standard up to 10 credits. Return the translated JSON.",
    "max_turns": 16,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "skill-loaded",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "aiglot-translate-file"
    },
    {
      "name": "workflow",
      "type": "llm",
      "focus": "mock_calls",
      "criteria": "PASS if the agent checks the account, verifies the plan, approves within the budget and includes relevant professional/B2B/formal register context in custom_instructions, preserves placeholders and retrieves the result. FAIL if it asks for redundant authorization, translates manually or puts file-selection rules only in approval guidelines."
    }
  ]
}
