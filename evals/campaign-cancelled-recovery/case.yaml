{
  "schema_version": "1.1",
  "name": "campaign-cancelled-recovery",
  "tags": [
    "expanded"
  ],
  "runs": 1,
  "execution": {
    "prompt": "Recover existing AI Glot batch 11111111-1111-4111-8111-111111111111. Tell me its status and whether a result can be downloaded. Do not restart, cancel, archive or spend credits.",
    "max_turns": 16,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "workflow",
      "type": "llm",
      "focus": "mock_calls",
      "criteria": "PASS if it reads the existing batch, recognizes cancelled as terminal and explains there is no completed result, without creating/approving/downloading or modifying history. FAIL if it restarts work, polls forever or implies cancellation is free."
    },
    {
      "name": "no-spend",
      "type": "regex",
      "target": "mock_calls",
      "pattern": "approve_translation",
      "match": "not_contains"
    }
  ]
}
