{
  "schema_version": "1.1",
  "tags": [
    "smoke"
  ],
  "runs": 1,
  "execution": {
    "max_turns": 14,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "prompt": "Translate both values of this JSON into French using AI Glot Standard: {\"greeting\":\"Hello {name}\",\"count\":\"You have {count} messages.\"}. I authorize the complete translation up to 10 credits. Do not silently omit either value."
  },
  "name": "excluded-scope",
  "graders": [
    {
      "name": "no-partial-spending",
      "type": "regex",
      "target": "mock_calls",
      "pattern": "approve_translation",
      "match": "not_contains"
    },
    {
      "name": "exclusion-explained",
      "type": "regex",
      "target": "last_message",
      "pattern": "(count|exclu|partial|untranslated|omit)",
      "flags": "i"
    }
  ]
}
